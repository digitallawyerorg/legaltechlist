# Intake spam blocklist for public submissions.
#
# UserSubmissionTriageService rejects a submission outright when it matches an
# entry here, before enrichment runs. Adding an entry is a one-line change: put
# the domain or host under the right list with a comment naming the submission it
# came from and the date. No code change is needed.

